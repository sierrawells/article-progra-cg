# Municipios creados después del Censo 2010 y su municipio "padre" de 2010
#
# Los datos de homicidios (2018) y de OCVED usan las claves de municipio
# vigentes en cada año, que incluyen municipios que no existían en el censo
# 2010. Para unir esos registros con los datos del censo, cada municipio nuevo
# se asigna al municipio de 2010 del que se separó.
#
# Fuente: INEGI, Archivo Histórico de Localidades Geoestadísticas,
# https://www.inegi.org.mx/app/geo2/ahl/

new_municipalities:
